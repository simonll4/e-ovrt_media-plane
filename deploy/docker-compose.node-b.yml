# ⚠️ DEPRECADO / ROTO (Fase 1). Este artefacto define el despliegue two-node por Docker
# basado en el CLI `eovrt-media run-producer/run-consumer`, que fue ELIMINADO al pasar el
# media-plane a servicio (Spec A, Fase 1). El command de abajo NO arranca.
# El split two-node (imágenes edge sin GPU / GPU sobre ZeroMQ) se rehará en Fase 2.
# Para el servicio single-host de Fase 1 usá el `Dockerfile` de la raíz + `make serve`.

# Despliegue real en el host GPU. El endpoint remoto vive en el YAML de Nodo B.
services:
  node-b:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.node-b
    command: ["--config", "${NODE_B_CONFIG:-/app/deploy-configs/two_node_b.example.yaml}"]
    volumes:
      - ../configs:/app/configs:ro
      - ./configs:/app/deploy-configs:ro
      - ../models:/app/models:ro
      - ../runs:/app/runs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
