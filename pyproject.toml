[project]
name = "eovrt-media-plane"
version = "0.1.0"
description = "Experimental media plane for E-OVRT-VDP"
requires-python = ">=3.11"
dependencies = [
    "pillow",
    "opencv-python",
    "pydantic",
    "pyyaml",
    "rich",
    "pyzmq",
    "msgpack",
    "fastapi>=0.110",
    "uvicorn[standard]",
]

[project.optional-dependencies]
edge = ["depthai>=2.24,<3", "blobconverter>=1.4.3"]
gpu = [
    "torch",
    "torchvision",
    "transformers",
    "accelerate",
    "huggingface_hub",
    "ultralytics",
]
dev = [
    "pytest",
    "ruff",
    "httpx",
    "supervision",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
