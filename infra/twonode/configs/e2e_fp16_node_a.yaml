run:
  scenario: EBE
  name: e2e_fp16_node_a
  description: "Validacion Docker local: productor FP16 con un frame."
  max_units: 1

source:
  type: image_folder
  path: /datasets/construction_site_safety/valid/images

model:
  ref: yoloe/yoloe-26s

prompts:
  ref: cr01_cr02_bench_v2
  active_ids: [person, helmet, vest, bare_head]

topology:
  mode: two_node

transport:
  backend: network
  endpoint: "tcp://0.0.0.0:5555"
  heartbeat_endpoint: "tcp://0.0.0.0:5556"
  payload_format: fp16
  request_timeout_ms: 10000
  compression:
    codec: raw
