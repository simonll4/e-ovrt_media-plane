run:
  scenario: EBE
  name: e2e_fp16_node_b
  description: "Validacion Docker local: consumidor CUDA de un frame FP16."

source:
  type: image_folder
  path: /datasets/construction_site_safety/valid/images

model:
  ref: yoloe/yoloe-26s
  device: cuda:0
  runtime:
    half_precision: true
    warmup: true

prompts:
  ref: cr01_cr02_bench_v2
  active_ids: [person, helmet, vest, bare_head]

topology:
  mode: two_node

transport:
  backend: network
  endpoint: "tcp://node-a:5555"
  heartbeat_endpoint: "tcp://node-a:5556"
  payload_format: fp16
  request_timeout_ms: 10000
  compression:
    codec: raw
